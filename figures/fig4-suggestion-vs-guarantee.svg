<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F7285"/></marker><marker id="headTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E8F9C"/></marker><marker id="headAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C97A1E"/></marker><linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#009AA8"/><stop offset="68%" stop-color="#009AA8"/><stop offset="74%" stop-color="#C97A1E"/><stop offset="100%" stop-color="#C97A1E"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="56" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="36" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">A suggestion is not a guarantee</text><text x="60" y="88" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="19" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Where an instruction lives decides whether the model can ignore it</text><text x="60" y="140" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#0E8F9C" font-weight="bold" text-anchor="start" letter-spacing="2.4" font-style="normal">THE MODEL DECIDES</text><text x="1540" y="140" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#C97A1E" font-weight="bold" text-anchor="end" letter-spacing="2.4" font-style="normal">THE SYSTEM ENFORCES</text><rect x="60" y="154" width="1480" height="8" rx="4" fill="url(#spec)"/><text x="60" y="214" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="19" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Context: the model weighs it, and can ignore it</text><text x="1130" y="214" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="19" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Enforcement: holds regardless</text><line x1="1110" y1="196" x2="1110" y2="690" stroke="#D3DCE3" stroke-width="2" stroke-dasharray="7 6"/><rect x="60" y="236" width="330" height="270" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="2"/><rect x="60" y="236" width="330" height="7" rx="3" fill="#009AA8"/><text x="84" y="286" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="23" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Always-on steering</text><text x="84" y="316" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Read on every task.</text><text x="84" y="360" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">CLAUDE.md</text><text x="84" y="390" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">AGENTS.md</text><text x="84" y="420" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">inclusion: always</text><text x="84" y="484" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="italic">weighed, not guaranteed</text><rect x="410" y="236" width="330" height="270" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="2"/><rect x="410"