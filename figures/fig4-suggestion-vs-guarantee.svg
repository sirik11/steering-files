ll="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">inclusion: auto · manual</text><text x="784" y="390" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">skills</text><text x="784" y="420" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">@rule-name</text><text x="784" y="484" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="italic">weighed, not guaranteed</text><rect x="1130" y="236" width="410" height="270" rx="10" fill="#FDF6EC" stroke="#EBD3AE" stroke-width="2"/><rect x="1130" y="236" width="410" height="7" rx="3" fill="#C97A1E"/><text x="1154" y="286" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="23" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Hooks, permissions, CI</text><text x="1154" y="316" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Run outside the model.</text><text x="1154" y="360" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">PreToolUse hook</text><text x="1154" y="390" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">permission deny rule</text><text x="1154" y="420" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">required CI check</text><text x="1154" y="484" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#C97A1E" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">holds no matter what it decides</text><rect x="60" y="540" width="1030" height="130" rx="10" fill="#FFFFFF" stroke="#D3DCE3" stroke-width="1.5"/><text x="88" y="580" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#0E8F9C" font-weight="bold" text-anchor="start" letter-spacing="2.4" font-style="normal">PUT HERE</text><text x="88" y="616" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Preferences: naming, style, and conventions that differ</text><text x="88" y="646" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">from the default.</text><rect x="1130" y="540" width="410" height="130" rx="10" fill="#FFFFFF" stroke="#D3DCE3" stroke-width="1.5"/><text x="1158" y="580" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#C97A1E" font-weight="bold" text-anchor="start" letter-spacing="2.4" font-style="normal">PUT HERE</text><text x="1158" y="616" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Must-nevers: production</text><text x="1158" y="646" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">migrations, credentials.</text><rect x="60" y="716" width="1480" height="92" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="1.5"/><text x="800" y="772" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="27" fill="#12293D" font-weight="bold" text-anchor="middle" letter-spacing="0" font-style="normal">Put preferences in steering. Put must-nevers in enforcement.</text><text x="60" y="852" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Claude Code&#x27;s docs: CLAUDE.md is “context, not enforced configuration”; to block an action regardless of what Claude decides, use a hook.</text></svg>