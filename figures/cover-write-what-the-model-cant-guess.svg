<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F7285"/></marker><marker id="headTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E8F9C"/></marker><marker id="headAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C97A1E"/></marker><linearGradient id="bg" x1="0.1" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#081926"/><stop offset="48%" stop-color="#0E2839"/><stop offset="100%" stop-color="#091E2C"/></linearGradient><radialGradient id="vignette" cx="50%" cy="42%" r="78%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.42"/></radialGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F5AE45" stop-opacity="0.30"/><stop offset="100%" stop-color="#F5AE45" stop-opacity="0"/></radialGradient><linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5AE45"/><stop offset="48%" stop-color="#3ACBD5"/><stop offset="100%" stop-color="#3ACBD5" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="78" y="70" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#7A98AB" font-weight="bold" text-anchor="start" letter-spacing="3.4" font-style="normal">AI ENGINEERING  ·  CODING AGENTS</text><text x="78" y="172" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="80" fill="#FFFFFF" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Write what</text><text x="78" y="262" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="80" fill="#FFFFFF" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">the model</text><text x="78" y="352" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="80" fill="#F5AE45" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">can’t guess.</text><rect x="80" y="390" width="330" height="4" rx="2" fill="url(#rule)"/><text x="78" y="446" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="25" fill="#B9CEDC" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Most of a steering file restates the code.</text><text x="78" y="482" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="25" fill="#B9CEDC" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">A few lines do all the work.</text><rect x="930" y="110" width="590" height="690" rx="16" fill="#0B2233" stroke="#1F4257" stroke-width="1.5"/><rect x="930" y="110" width="590" height="50" rx="16" fill="#0F2C40"/><rect x="930" y="144" width="590" height="16" fill="#0F2C40"/><circle cx="958" cy="135" r="6" fill="#B14B33" opacity="0.8"/><circle cx="980" cy="135" r="6" fill="#C97A1E" opacity="0.8"/><circle cx="1002" cy="135" r="6" fill="#3ACBD5" opacity="0.8"/><text x="1225.0" y="141" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#7A98AB" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="normal">AGENTS.md</text><text x="970" y="202" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">## Project structure</text><text x="970" y="234" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">src/</text><text x="970" y="266" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">├── api/        REST handlers</text><text x="970" y="298" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">├── components/ React UI</text><text x="970" y="330" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">└── utils/      helpers</text><text x="970" y="394" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">## Tech stack</text><text x="970" y="426" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">- React 18, TypeScript, Node 20</text><text x="970" y="458" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">- PostgreSQL via Prisma</text><text x="970" y="522" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">## Conventions</text><ellipse cx="1180" cy="548" rx="300" ry="26" fill="url(#glow)"/><rect x="952" y="530" width="546" height="32" rx="6" fill="#F5AE45" opacity="0.14"/><rect x="952" y="530" width="4" height="32" fill="#F5AE45"/><text x="970" y="554" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="17" fill="#F5AE45" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">- money is integer cents, never floats</text><ellipse cx="1180" cy="580" rx="300" ry="26" fill="url(#glow)"/><rect x="952" y="562" width="546" height="32" rx="6" fill="#F5AE45" opacity="0.14"/><rect x="952" y="562" width="4" height="32" fill="#F5AE45"/><text x="970" y="586" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="17" fill="#F5AE45" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">- use pnpm, not npm</text><ellipse cx="1180" cy="612" rx="300" ry="26" fill="url(#glow)"/><rect x="952" y="594" width="546" height="32" rx="6" fill="#F5AE45" opacity="0.14"/><rect x="952" y="594" width="4" height="32" fill="#F5AE45"/><text x="970" y="618" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="17" fill="#F5AE45" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">- payments client only in billing/</text><text x="970" y="682" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">## Architecture</text><text x="970" y="714" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="16" fill="#5D7D91" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal" opacity="0.62">Services talk to each other over REST.</text><text x="1494" y="774" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#F5AE45" font-weight="bold" text-anchor="end" letter-spacing="2.4" font-style="normal">THREE LINES DO THE WORK</text><rect width="1600" height="900" fill="url(#vignette)"/><text x="78" y="842" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="13" fill="#7A98AB" font-weight="bold" text-anchor="start" letter-spacing="2.4" font-style="normal">KIRO  ·  CLAUDE CODE  ·  CURSOR  ·  COPILOT  ·  AGENTS.MD</text></svg>