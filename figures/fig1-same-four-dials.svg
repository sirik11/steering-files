514622 799.5998696624938, 688.7389664616829 797.0572718942249" stroke="#2E6BA6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M689.1476325295865 796.9698356725276 C690.5135654592086 798.266363967071, 690.5438259348077 801.8942651609493, 690.7185639725798 810.9343167494615 M690.1128436971455 796.2781049143523 C689.9409302038049 799.5593833636209, 690.3063749875256 801.7382669271732, 690.1620906246626 811.409339438342" stroke="#2E6BA6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M690.8619905982166 796.3481665160507 C686.4894429737026 798.4766711428573, 683.7486645618741 798.7268781271281, 675.9280785081656 801.7732626318532 M690.3236443592235 795.8368640797213 C686.6216684612463 797.9778861093787, 683.7459711776949 799.4452860826999, 676.0995373822497 803.0645735432926" stroke="#2E6BA6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="712" y="842" font-family="Kalam, 'Bradley Hand', cursive" font-size="27" fill="#2E6BA6" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-1 712 842)">the dial that matters most. every tool has it. most files never use it.</text><text x="80" y="884" font-family="'Libre Baskerville', Georgia, serif" font-size="14" fill="#6F6A60" font-weight="400" text-anchor="start" font-style="italic" letter-spacing="0">Syntax as documented by each vendor, October 2026. Kiro CLI does not yet support inclusion modes.</text><rect x="-50" y="-50" width="1700" height="1000" filter="url(#grain)"/></svg>