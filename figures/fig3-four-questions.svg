.0" stroke="#5F7285" stroke-width="2.5" marker-end="url(#head)"/><text x="750" y="312.0" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="16" fill="#5F7285" font-weight="bold" text-anchor="middle" letter-spacing="0" font-style="normal">yes</text><line x1="240" y1="376" x2="240" y2="408" stroke="#5F7285" stroke-width="2.5" marker-end="url(#head)"/><text x="256" y="401" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="16" fill="#5F7285" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">no</text><rect x="806" y="272" width="734" height="104" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="2"/><rect x="806" y="272" width="8" height="104" rx="3" fill="#C97A1E"/><text x="840" y="316" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="25" fill="#C97A1E" font-weight="bold" text-anchor="start" letter-spacing="1.4" font-style="normal">ENFORCE IT ELSEWHERE</text><text x="840" y="350" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">A hook, a permission rule, or a CI check. Not steering.</text><rect x="60" y="412" width="640" height="104" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="2"/><circle cx="104" cy="464.0" r="22" fill="#12293D"/><text x="104" y="472.0" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="0" font-style="normal">3</text><text x="146" y="456" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="23" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Does it only apply to</text><text x="146" y="488" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="23" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">part of the codebase?</text><line 