yle="italic">the model can&#x27;t infer</text><line x1="704" y1="604.0" x2="796" y2="604.0" stroke="#5F7285" stroke-width="2.5" marker-end="url(#head)"/><rect x="806" y="552" width="734" height="104" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="2"/><rect x="806" y="552" width="8" height="104" rx="3" fill="#12293D"/><text x="840" y="596" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="25" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="1.4" font-style="normal">KEEP IT</text><text x="840" y="630" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">&quot;money is integer cents&quot;  ·  &quot;pnpm, not npm&quot;  ·  &quot;payments only in billing/&quot;</text><rect x="60" y="718" width="1480" height="96" rx="10" fill="#FDF6EC" stroke="#EBD3AE" stroke-width="1.5"/><text x="800" y="768" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="24" fill="#12293D" font-weight="bold" text-anchor="middle" letter-spacing="0" font-style="normal">What survives is short: the conventions nothing in the code would have told the agent.</text><text x="800" y="798" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#C97A1E" font-weight="bold" text-anchor="middle" letter-spacing="0" font-style="italic">Write what the model can&#x27;t guess.</text></svg>