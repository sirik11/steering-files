<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F7285"/></marker><marker id="headTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E8F9C"/></marker><marker id="headAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C97A1E"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="56" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="36" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">What goes into agent context files</text><text x="60" y="88" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="19" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">We write down how the code works. We rarely write down how to keep it safe.</text><rect x="60" y="128" width="16" height="16" rx="3" fill="#009AA8"/><text x="86" y="142" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Written often: how the code works</text><rect x="420" y="128" width="16" height="16" rx="3" fill="#B14B33"/><text x="446" y="142" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="17" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Rarely written: guardrails</text><line x1="420.0" y1="178" x2="420.0" y2="540" stroke="#E6ECF0" stroke-width="1.5"/><text x="420.0" y="566" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="normal">0%</text><line x1="640.0" y1="178" x2="640.0" y2="540" stroke="#E6ECF0" stroke-width="1.5"/><text x="640.0" y="566" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="normal">25%</text><line x1="860.0" y1="178" x2="860.0" y2="540" stroke="#E6ECF0" stroke-width="1.5"/><text x="860.0" y="566" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="normal">50%</text><line x1="1080.0" y1="178" x2="1080.0" y2="540" stroke="#E6ECF0" stroke-width="1.5"/><text x="1080.0" y="566" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="normal">75%</text><line x1="1300.0" y1="178" x2="1300.0" y2="540" stroke="#E6ECF0" stroke-width="1.5"/><text x="1300.0" y="566" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="middle" letter-spacing="0" font-style="normal">100%</text><text x="400" y="221" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="20" fill="#12293D" font-weight="normal" text-anchor="end" letter-spacing="0" font-style="normal">Test procedures</text><path d="M420,190 H1083.92 Q1087.92,190 1087.92,194 V232 Q1087.92,236 1083.92,236 H420 Z" fill="#009AA8"/><text x="1101.92" y="221" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">75.9%</text><text x="400" y="285" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="20" fill="#12293D" font-weight="normal" text-anchor="end" letter-spacing="0" font-style="normal">Implementation details</text><path d="M420,254 H1039.04 Q1043.04,254 1043.04,258 V296 Q1043.04,300 1039.04,300 H420 Z" fill="#009AA8"/><text x="1057.04" y="285" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">70.8%</text><text x="400" y="349" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="20" fill="#12293D" font-weight="normal" text-anchor="end" letter-spacing="0" font-style="normal">Architecture</text><path d="M420,318 H1015.28 Q1019.28,318 1019.28,322 V360 Q1019.28,364 1015.28,364 H420 Z" fill="#009AA8"/><text x="1033.28" y="349" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">68.1%</text><text x="400" y="449" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="20" fill="#12293D" font-weight="normal" text-anchor="end" letter-spacing="0" font-style="normal">Security</text><path d="M420,418 H546.24 Q550.24,418 550.24,422 V460 Q550.24,464 546.24,464 H420 Z" fill="#B14B33"/><text x="564.24" y="449" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">14.8%</text><text x="400" y="513" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="20" fill="#12293D" font-weight="normal" text-anchor="end" letter-spacing="0" font-style="normal">Performance</text><path d="M420,482 H543.6 Q547.6,482 547.6,486 V524 Q547.6,528 543.6,528 H420 Z" fill="#B14B33"/><text x="561.6" y="513" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">14.5%</text><rect x="60" y="594" width="730" height="196" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="1.5"/><rect x="60" y="594" width="7" height="196" rx="3" fill="#009AA8"/><text x="92" y="636" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Mostly what the agent can read for itself</text><text x="92" y="670" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">A controlled study found repository overviews did not</text><text x="92" y="698" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">improve task success, while context files added over</text><text x="92" y="726" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">20% to inference cost.</text><text x="92" y="772" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="italic">Gloaguen et al., ETH Zurich and LogicStar.ai, 2026</text><rect x="810" y="594" width="730" height="196" rx="10" fill="#F5F8FA" stroke="#D3DCE3" stroke-width="1.5"/><rect x="810" y="594" width="7" height="196" rx="3" fill="#B14B33"/><text x="842" y="636" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="21" fill="#12293D" font-weight="bold" text-anchor="start" letter-spacing="0" font-style="normal">Rarely, what keeps agent code safe and fast</text><text x="842" y="670" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Security and performance guidance appears in fewer than</text><text x="842" y="698" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">one in six files. The study calls it a significant gap.</text><text x="842" y="726" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="18" fill="#12293D" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal"></text><text x="842" y="772" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="14" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="italic">Chatlatanagulchai et al., 2025</text><text x="60" y="852" font-family="Carlito, DejaVu Sans, Helvetica, sans-serif" font-size="15" fill="#5F7285" font-weight="normal" text-anchor="start" letter-spacing="0" font-style="normal">Share of 2,303 agent context files from 1,925 repositories containing each instruction type (five of the 16 types studied). Source: arXiv 2511.12884.</text></svg>